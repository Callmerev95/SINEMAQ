<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sinemaq" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Sinemaq</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="red" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#FF2A36"/>
      <stop offset="1" stop-color="#B00610"/>
    </linearGradient>
  </defs>

  <!-- Background charcoal -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ring + tail = huruf "Q" (Sinema-Q) -->
  <circle cx="246" cy="238" r="128" fill="none" stroke="url(#red)" stroke-width="50"/>
  <line x1="341" y1="333" x2="394" y2="386" stroke="url(#red)" stroke-width="50" stroke-linecap="round"/>

  <!-- Play button -->
  <polygon points="222,194 222,282 294,238" fill="url(#red)" stroke="url(#red)" stroke-width="24" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
